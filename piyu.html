
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form with Make Automation</title>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 5px;
    }

    textarea {
      min-height: 100px;
    }

    .error-border {
      border: 2px solid red;
    }

    .error-message {
      color: red;
      font-size: 12px;
      display: none;
    }

    .success-message,
    .error-status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 5px;
    }

    .success-message {
      color: #176b35;
      background: #e6f6eb;
    }

    .error-status {
      color: #b42318;
      background: #feeceb;
    }

    button {
      padding: 12px 22px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <h2>Contact Form</h2>

  <form id="myForm">
    <div>
      <input type="text" id="name" name="name"
        placeholder="Name" required>
      <div class="error-message" id="nameError">
        Name is required.
      </div>
    </div>
    <br>

    <div>
      <input type="email" id="email" name="email"
        placeholder="Email" required>
      <div class="error-message" id="emailError">
        Enter a valid email address.
      </div>
    </div>
    <br>

    <div>
      <input type="tel" id="phone" name="phone"
        placeholder="Phone Number" required>
      <div class="error-message" id="phoneError">
        Phone number is required.
      </div>
    </div>
    <br>

    <div>
      <textarea id="message" name="message"
        placeholder="Message" required></textarea>
      <div class="error-message" id="messageError">
        Message is required.
      </div>
    </div>
    <br>

    <button type="submit" id="submitButton">
      Submit
    </button>
  </form>

  <div class="success-message" id="successMessage" role="status">
    Form submitted successfully!
  </div>

  <div class="error-status" id="errorMessage" role="alert">
    Submission failed. Please try again.
  </div>

  <script>
    const WEBHOOK_URL =
      "https://hook.eu2.make.com/17kh9jkjgob256jb2g5325n9cenq7v3i";

    $(function () {
      const $form = $("#myForm");

      $form.on("submit", async function (event) {
        event.preventDefault();

        $("#successMessage, #errorMessage").hide();
        $(".error-message").hide();
        $("input, textarea").removeClass("error-border");

        const name = $("#name").val().trim();
        const email = $("#email").val().trim();
        const phone = $("#phone").val().trim();
        const message = $("#message").val().trim();

        let valid = true;

        function showError(field, errorId) {
          $(field).addClass("error-border");
          $(errorId).show();
          valid = false;
        }

        if (!name) {
          showError("#name", "#nameError");
        }

        if (!email || !$("#email")[0].checkValidity()) {
          showError("#email", "#emailError");
        }

        if (!phone) {
          showError("#phone", "#phoneError");
        }

        if (!message) {
          showError("#message", "#messageError");
        }

        if (!valid) return;

        const $button = $("#submitButton");
        $button.prop("disabled", true).text("Submitting...");

        try {
          const formData = new URLSearchParams({
            name,
            email,
            phone,
            message
          });

          const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body: formData.toString()
          });

          if (!response.ok) {
            throw new Error("Webhook request failed");
          }

          const result = await response.text();

          if (result.trim().toLowerCase() !== "success") {
            throw new Error("Make did not confirm completion");
          }

          $("#successMessage").show();
          $form[0].reset();

        } catch (error) {
          console.error("Form submission error:", error);
          $("#errorMessage").text(
            "Submission could not be confirmed. Please try again."
          ).show();

        } finally {
          $button.prop("disabled", false).text("Submit");
        }
      });

      $("input, textarea").on("input", function () {
        $(this).removeClass("error-border");
        $(this).siblings(".error-message").hide();
      });
    });
  </script>

</body>
</html>
