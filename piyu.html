<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form - Make Automation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 5px;
    }

    textarea {
      min-height: 100px;
    }

    .error-border {
      border: 2px solid red;
    }

    .error-message {
      color: red;
      font-size: 12px;
      display: none;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 5px;
    }

    .success-message {
      color: #176b35;
      background: #e6f6eb;
    }

    .error-status {
      color: #b42318;
      background: #feeceb;
    }

    button {
      padding: 12px 22px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <h2>Contact Form</h2>

  <form id="myForm">
    <div>
      <input type="text" id="name" name="name"
        placeholder="Name" required>
      <div class="error-message" id="nameError">
        Name is required.
      </div>
    </div>
    <br>

    <div>
      <input type="email" id="email" name="email"
        placeholder="Email" required>
      <div class="error-message" id="emailError">
        Enter a valid email address.
      </div>
    </div>
    <br>

    <div>
      <input type="tel" id="phone" name="phone"
        placeholder="Phone Number" required>
      <div class="error-message" id="phoneError">
        Phone number is required.
      </div>
    </div>
    <br>

    <div>
      <textarea id="message" name="message"
        placeholder="Message" required></textarea>
      <div class="error-message" id="messageError">
        Message is required.
      </div>
    </div>
    <br>

    <button type="submit" id="submitButton">Submit</button>
  </form>

  <div class="status success-message" id="successMessage" role="status">
    Form submitted successfully!
  </div>

  <div class="status error-status" id="errorMessage" role="alert">
    Submission failed. Please try again.
  </div>

  <script>
    const WEBHOOK_URL =
      "https://hook.eu2.make.com/17kh9jkjgob256jb2g5325n9cenq7v3i";

    const form = document.getElementById("myForm");
    const button = document.getElementById("submitButton");

    const successMessage = document.getElementById("successMessage");
    const errorMessage = document.getElementById("errorMessage");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      successMessage.style.display = "none";
      errorMessage.style.display = "none";

      document.querySelectorAll(".error-message").forEach(el => {
        el.style.display = "none";
      });

      document.querySelectorAll("#myForm input, #myForm textarea")
        .forEach(el => el.classList.remove("error-border"));

      let valid = true;

      const fields = [
        ["name", "nameError"],
        ["email", "emailError"],
        ["phone", "phoneError"],
        ["message", "messageError"]
      ];

      fields.forEach(([fieldId, errorId]) => {
        const field = document.getElementById(fieldId);

        if (!field.value.trim() || !field.checkValidity()) {
          field.classList.add("error-border");
          document.getElementById(errorId).style.display = "block";
          valid = false;
        }
      });

      if (!valid) return;

      button.disabled = true;
      button.textContent = "Submitting...";

      try {
        const formData = new URLSearchParams(
          new FormData(form)
        );

        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: formData.toString()
        });

        if (!response.ok) {
          throw new Error("HTTP status " + response.status);
        }

        const result = (await response.text()).trim();

        console.log("Make response:", response.status, result);

        // Make Webhook Response module should return HTTP 200
        // after the required automation steps have completed.
        // JSON, HTML, or empty responses are not treated as failure.
        successMessage.style.display = "block";
        form.reset();

      } catch (error) {
        console.error("Form submission error:", error);

        errorMessage.textContent =
          "We couldn't confirm the submission. Please check your connection or contact us.";

        errorMessage.style.display = "block";

      } finally {
        button.disabled = false;
        button.textContent = "Submit";
      }
    });

    document.querySelectorAll("#myForm input, #myForm textarea")
      .forEach(field => {
        field.addEventListener("input", function () {
          this.classList.remove("error-border");

          const error = document.getElementById(this.id + "Error");

          if (error) {
            error.style.display = "none";
          }
        });
      });
  </script>
</body>
</html>
